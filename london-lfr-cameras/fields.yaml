# Field definitions for the London live-facial-recognition survey.
#
# Structure note for the researching agent: emit a FLAT JSON object whose
# top-level keys are the field names below. Do not nest them under the
# category headings — the categories here are only to group the definitions
# for a human reader, and the validator flattens them anyway.
#
# The one exception is `cameras`, which is a list of objects; its per-camera
# shape is given in its description.

output_structure: flat

fields:
  basic_info:
    - name: item_name
      description: The research unit as named in outline.yaml.
      detail_level: brief
      required: true
    - name: operator
      description: Who runs the cameras - police force, retailer, landlord, transport body.
      detail_level: brief
      required: true
    - name: system_type
      description: >
        One of police_fixed, police_van, facewatch, other_private, transport,
        or mixed. This is the axis the whole survey turns on, because the
        question asked was about FIXED cameras and most UK LFR is van-mounted.
      detail_level: brief
      required: true
    - name: vendor
      description: Software/hardware supplier (NEC NeoFace, Facewatch, Corsight, etc.).
      detail_level: brief
      required: false
    - name: london_coverage_summary
      description: Two or three sentences on what this operator actually has running in Greater London.
      detail_level: moderate
      required: true

  deployment_detail:
    - name: cameras
      description: >
        List of individual camera sites, as specific as the evidence allows.
        Each entry: {site_name, address, postcode, borough, lat, lng,
        camera_type (fixed|van|unknown), installed_date, status
        (active|paused|ended|unknown), confidence (confirmed|reported|rumoured),
        source_url}. Use an empty list if no site-level detail is public - do
        NOT invent addresses or coordinates. An empty list with an honest
        explanation in key_uncertainties is a correct answer here.
      detail_level: detailed
      required: true
    - name: camera_count_confirmed
      description: Number of individual sites you could name and source. Integer.
      detail_level: brief
      required: true
    - name: camera_count_claimed
      description: Number the operator or press claims exists, which is usually much larger than the nameable set.
      detail_level: brief
      required: false
    - name: fixed_vs_mobile
      description: Breakdown of how many are permanently installed versus vehicle-mounted or redeployable.
      detail_level: moderate
      required: true
    - name: geographic_concentration
      description: Which boroughs, high streets or corridors the deployments cluster in.
      detail_level: moderate
      required: false

  currency:
    - name: status_as_of_2026
      description: active, paused, ended, or unknown - as of 2026. The user explicitly asked whether these are still running today.
      detail_level: brief
      required: true
    - name: last_confirmed_active_date
      description: Most recent date with hard evidence of operation. Give the date and what the evidence was.
      detail_level: moderate
      required: true
    - name: evidence_of_current_activity
      description: What specifically shows it is still live - a 2026 deployment notice, a press report, a published arrest figure, signage photographed recently.
      detail_level: moderate
      required: true
    - name: known_pauses_or_withdrawals
      description: Any store, force or site that has stopped. Retailers have quietly dropped Facewatch before.
      detail_level: moderate
      required: false

  transparency:
    - name: locations_published_publicly
      description: yes, partial, or no - whether the operator itself publishes where the cameras are.
      detail_level: brief
      required: true
    - name: publication_channel
      description: Where, exactly, with a URL if one exists.
      detail_level: moderate
      required: false
    - name: live_feed_or_map_available
      description: >
        Whether current or upcoming locations are shown live anywhere - official
        or third-party, map or list. This is the second half of the user's
        question and matters most for the LFR vans. Say plainly if the answer
        is no.
      detail_level: detailed
      required: true
    - name: advance_notice_period
      description: How far ahead a deployment is announced, if at all.
      detail_level: brief
      required: false
    - name: foi_or_audit_sources
      description: FOI responses, Big Brother Watch or Liberty audits, ICO material that enumerate sites.
      detail_level: moderate
      required: false

  legal:
    - name: legal_basis
      description: Claimed lawful basis for the processing.
      detail_level: moderate
      required: false
    - name: regulatory_challenges
      description: Court rulings, ICO enforcement, live judicial review. Bridges v South Wales and anything since.
      detail_level: moderate
      required: false
    - name: oversight_body
      description: Who, if anyone, supervises it.
      detail_level: brief
      required: false

  meta:
    - name: research_confidence
      description: high, medium or low, on the site-level list specifically - not on the general narrative.
      detail_level: brief
      required: true
    - name: key_uncertainties
      description: What you could not establish and why. Be specific; this is the most useful field in the file.
      detail_level: detailed
      required: true
    - name: sources
      description: List of {title, url, date, what_it_supports}. Primary sources over aggregators.
      detail_level: detailed
      required: true

uncertain: []
